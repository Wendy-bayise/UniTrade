<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>UniTrade | Student Marketplace</title>
    <link rel="stylesheet" href="dashboard.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <div class="brand">
        <div class="brand-mark">UT</div>
        <div class="brand-name">Uni<span>Trade</span></div>
    </div>
    <div class="nav-links">
        <a href="dashboard.html" class="active">Marketplace</a>
        <a href="listings.html">My Listings</a>
        <a href="messages.html">Messages</a>
    </div>
    <div class="nav-user">
        <div class="user-greeting">Welcome, <strong id="userNameDisplay">Student</strong></div>
        <a href="checkout.html" class="cart-link">
            <i class="fas fa-bag-shopping"></i>
            <span class="cart-badge" id="cartBadge">0</span>
        </a>
        <div class="avatar-chip" id="userAvatarInitial">S</div>
        <a href="login.html" class="logout-link" id="logoutLink"><i class="fas fa-right-from-bracket"></i> Log out</a>
    </div>
</nav>
<div class="id-stripe"></div>

<div class="app-container">

    <div class="top-controls">
        <div class="search-box">
            <div class="search-input-wrapper">
                <i class="fas fa-magnifying-glass"></i>
                <label for="searchInput"></label><input type="text" id="searchInput" placeholder="Search Product Name..." autocomplete="off">
            </div>
        </div>
        <div class="categories-wrapper">
            <div class="cat-list" id="categoryList">

            </div>
        </div>
    </div>


    <div class="sell-section">
        <div class="sell-header">
            <i class="fas fa-plus-circle"></i>
            <h2>Sell Your Item</h2>
            <p>List your product for others to buy</p>
        </div>
        <form id="sellForm" class="sell-form">
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Product Name</label>
                    <label for="productName"></label><input type="text" id="productName" placeholder="e.g., Wireless Headphones" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-layer-group"></i> Category</label>
                    <label for="productCategory"></label><select id="productCategory" required>
                    <option value="">Select Category</option>
                    <option value="Home">Home</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Shirts">Shirts</option>
                    <option value="Mens Wear">Mens Wear</option>
                    <option value="Women Wear">Women Wear</option>
                    <option value="Shoes">Shoes</option>
                    <option value="Clothes">Clothes</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Accessories">Accessories</option>
                </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-rand"></i> Selling Price (R)</label>
                    <label for="productPrice"></label><input type="number" id="productPrice" step="0.01" placeholder="0.00" required>

                    <label><i class="fas fa-rand"></i> Original Price (R)</label>
                    <label for="productOriginalPrice"></label><input type="number" id="productOriginalPrice" step="0.01"
                                                                     placeholder="0.00" required>
                </div>
            </div>
            <button type="submit" class="sell-btn"><i class="fas fa-cloud-upload-alt"></i> List Item for Sale</button>
        </form>
    </div>


    <main class="products-main">
        <div class="section-header">
            <h1>Products</h1>
            <p>Browse items from our community marketplace</p>
        </div>


        <div id="productsGridContainer" class="products-grid">

        </div>


        <div class="pagination-footer">
            <div class="showing-info" id="showingRangeInfo">
                Showing 1 to 5 of 12 results
            </div>
            <div class="pagination-controls">
                <button class="page-btn" id="prevPageBtn" disabled><i class="fas fa-chevron-left"></i> Prev</button>
                <button class="page-btn" id="nextPageBtn">Next <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </main>
</div>

<script src="common.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
